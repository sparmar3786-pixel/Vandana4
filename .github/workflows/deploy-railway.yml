name: Deploy Vandana4 backend to Railway
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install -g @railway/cli
      - name: Deploy when token is configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN is not configured; skipping Railway deploy."
            exit 0
          fi
          railway up --project db2f47ec-65a7-4089-b47a-d56557cfe644 --environment production --service nse-algo-backend-final --ci
