name: Deploy Vandana4 backend to Railway
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    if: ${{ secrets.RAILWAY_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: railwayapp/cli-action@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
      - run: railway up --project db2f47ec-65a7-4089-b47a-d56557cfe644 --environment production --service nse-algo-backend-final --ci
