services:
  - type: web
    name: nse-ai-terminal-v4
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.final_main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATA_SOURCE
        value: angel_one
      - key: MCP_ENABLED
        value: "on"
      - key: ADVANCED_ENGINE
        value: "on"
      - key: ENABLE_LIVE_ORDERS
        value: "0"
      - key: REQUIRE_HUMAN_CONFIRM
        value: "1"
